name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-bash-tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then exit 0; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
      - name: ShellCheck
        run: |
          shellcheck bin/wrk tests/test-wrk.sh tests/wrk_spillover.sh \
            tests/test-openai-independent-gate.sh \
            tests/test-builder-path.sh \
            tests/test-followup-injection.sh \
            tests/test-report-outside-worktree.sh \
            tests/test-model-contract-guard.sh \
            tests/test-installer-route.sh \
            tests/test-installer-deploy-record.sh \
            tests/test-prompt-suggestion-off.sh \
            tests/test-untagged-operator-evidence.sh \
            tests/test-event-monitor-doc.sh \
            $(find tests/fixtures -maxdepth 1 -type f ! -name '*.json' -perm -111 -print)
      - name: Bash tests
        env:
          SCOPEFUEL_BIN: ${{ github.workspace }}/tests/fixtures/scopefuel
        run: |
          bash tests/test-wrk.sh
          bash tests/wrk_spillover.sh
          bash tests/test-arbiter.sh
          bash tests/test-acp-runner-process-group.sh
          bash tests/test-openai-independent-gate.sh
          bash tests/test-builder-path.sh
          bash tests/test-followup-injection.sh
          bash tests/test-report-outside-worktree.sh
          bash tests/test-model-contract-guard.sh
          bash tests/test-installer-route.sh
          bash tests/test-installer-deploy-record.sh
          bash tests/test-prompt-suggestion-off.sh
          bash tests/test-untagged-operator-evidence.sh
          bash tests/test-event-monitor-doc.sh
