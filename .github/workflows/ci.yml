name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      full_macos:
        description: Run the complete suite on macOS
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: Exact ref (sha) to check out; empty means the event default
        required: false
        default: ''
        type: string
      suite:
        description: Which suites to run (all, lint, suites-a, suites-b, python, macos-smoke)
        required: false
        default: all
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then exit 0; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
      - name: ShellCheck
        run: |
          shellcheck tests/test-followup-injection.sh \
            tests/test-report-outside-worktree.sh \
            tests/test-installer-route.sh \
            tests/test-installer-deploy-record.sh \
            tests/test-untagged-operator-evidence.sh \
            tests/test-event-monitor-doc.sh \
            tests/test-decision-request-doc.sh \
            tests/test-input-line-not-evidence.sh \
            tests/test-ops-wake-contract.sh \
            tests/test-install-prune.sh \
            tests/test-fleet-rev.sh \
            tests/test-area-propose.sh \
            tests/test-ci-suites.sh \
            tests/test-ci-any-ref.sh \
            tests/needs-full-macos.sh \
            scripts/needs-full-macos \
            scripts/resolve-ci-ref \
            tests/fixtures/fleet-rev/fake-ssh \
            tests/fixtures/fleet-rev/fake-gh \
            tests/fixtures/fleet-rev/panewire \
            tests/fixtures/fleet-rev/handoffkeep \
            tests/fixtures/fleet-rev/go \
            tests/fixtures/herdr \
            tests/fixtures/scopefuel

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      needs_full_macos: ${{ steps.macos.outputs.needs_full_macos }}
      sensitive_paths: ${{ steps.macos.outputs.sensitive_paths }}
      shards: ${{ steps.suites.outputs.shards }}
      smoke: ${{ steps.suites.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: suites
        name: Resolve suite selector
        shell: bash
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "$SUITE" in
            all)         SHARDS='["suites-a","suites-b","python"]'; SMOKE=true ;;
            lint)        SHARDS='[]'; SMOKE=false ;;
            macos-smoke) SHARDS='[]'; SMOKE=true ;;
            suites-a|suites-b|python) SHARDS="[\"$SUITE\"]"; SMOKE=false ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
      - id: classify
        name: Classify docs-only changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python3 - "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_HEAD_REF" "$GITHUB_RUN_ID" "$RUNNER_TEMP/changed-paths" <<'PY'
          import json
          import subprocess
          import sys

          base_sha, head_sha, repository, branch, current_run, changed_file = sys.argv[1:]
          required = {
              "lint", "ubuntu (suites-a)", "ubuntu (suites-b)",
              "ubuntu (python)", "macos-smoke", "ci-ok",
          }

          def gh_json(*args):
              result = subprocess.run(["gh", "api", *args], check=True, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              return json.loads(result.stdout)

          def is_ancestor(candidate):
              return subprocess.run(["git", "merge-base", "--is-ancestor", candidate, head_sha],
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0

          baseline = None
          try:
              runs = gh_json("-X", "GET", f"repos/{repository}/actions/runs",
                             "-f", f"branch={branch}", "-f", "event=pull_request",
                             "-f", "status=success", "-f", "per_page=100")["workflow_runs"]
              for run in runs:
                  if str(run["id"]) == current_run or not is_ancestor(run["head_sha"]):
                      continue
                  jobs = gh_json("-X", "GET", f"repos/{repository}/actions/runs/{run['id']}/jobs",
                                 "-f", "per_page=100")["jobs"]
                  successful = {job["name"] for job in jobs
                                if job.get("status") == "completed" and job.get("conclusion") == "success"}
                  if required <= successful:
                      baseline = run["head_sha"]
                      break
          except (KeyError, OSError, subprocess.CalledProcessError, json.JSONDecodeError):
              # On API trouble, use the complete PR diff; it can skip only if every changed path is docs-only.
              baseline = None

          start = baseline or base_sha
          diff = ["git", "diff", "--name-only", "--no-renames", f"{start}...{head_sha}"]
          paths = subprocess.check_output(diff, text=True).splitlines()
          with open(changed_file, "w", encoding="utf-8") as handle:
              handle.write("\n".join(paths) + ("\n" if paths else ""))
          print(f"Docs-only comparison baseline: {baseline or base_sha}")
          PY
          elif [[ "$GITHUB_EVENT_NAME" == push && "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]]; then
            git diff --name-only --no-renames "${{ github.event.before }}" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
          else
            : > "$RUNNER_TEMP/changed-paths"
          fi
          python3 - director/gate_policy.json "$RUNNER_TEMP/changed-paths" "$GITHUB_EVENT_NAME" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          policy = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          changed = [line for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines() if line]
          event = sys.argv[3]
          pinned = set(policy.get("local_sources", {}))
          docs_only = bool(changed) and event in {"pull_request", "push"} and all(
              path.endswith(".md") or path.startswith("docs/") for path in changed
          ) and not any(
              path in pinned or path.startswith(".github/") for path in changed
          )
          print(f"docs_only={'true' if docs_only else 'false'}")
          PY
      - id: macos
        name: Report Darwin-sensitive coverage
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.ref || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.ref || github.sha }}
        run: |
          RESULT="$(scripts/needs-full-macos "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$RESULT"
          NEEDS="$(printf '%s\n' "$RESULT" | sed -n '1p')"
          PATHS="$(printf '%s\n' "$RESULT" | sed -n '2,$p' | paste -sd, -)"
          echo "needs_full_macos=$NEEDS" >> "$GITHUB_OUTPUT"
          echo "sensitive_paths=$PATHS" >> "$GITHUB_OUTPUT"
          {
            echo '### Darwin-sensitive changes'
            echo
            if [[ "$NEEDS" == yes ]]; then
              echo 'Full macOS verification is required before READY for these changed paths:'
              printf '%s\n' "$RESULT" | tail -n +2 | sed 's/^/- `/' | sed 's/$/`/'
            else
              echo 'No uncovered Darwin-sensitive paths changed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ubuntu:
    name: ubuntu (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.shards != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      SCOPEFUEL_BIN: ${{ github.workspace }}/tests/fixtures/scopefuel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run suite shard
        shell: bash
        run: |
          if [[ "${{ matrix.shard }}" == python ]]; then
            CI_PY_TMP="$(mktemp -d /tmp/ci-py.XXXXXX)"
            mkdir -p "$CI_PY_TMP"/{home,config,data,cache,state,runtime,codex,jobs}
            export HOME="$CI_PY_TMP/home" XDG_CONFIG_HOME="$CI_PY_TMP/config"
            export XDG_DATA_HOME="$CI_PY_TMP/data" XDG_CACHE_HOME="$CI_PY_TMP/cache"
            export XDG_STATE_HOME="$CI_PY_TMP/state" XDG_RUNTIME_DIR="$CI_PY_TMP/runtime"
            export XDG_CONFIG_DIRS="$CI_PY_TMP/config" XDG_DATA_DIRS="$CI_PY_TMP/data"
            export CODEX_HOME="$CI_PY_TMP/codex" ARBITER_INBOX_ROOT="$CI_PY_TMP/jobs"
            export TMPDIR="$CI_PY_TMP" WRK_TEST_MODE=1
            trap 'rm -rf "$CI_PY_TMP"' EXIT
          fi
          while IFS='|' read -r shard command; do
            [[ -n "$shard" && "$shard" != \#* ]] || continue
            if [[ "$shard" == "${{ matrix.shard }}" ]]; then
              echo "::group::$command"
              bash -c "$command"
              echo '::endgroup::'
            fi
          done < tests/ci-suites.txt

  macos-smoke:
    name: macos-smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.smoke == 'true'
    runs-on: macos-latest
    env:
      SCOPEFUEL_BIN: ${{ github.workspace }}/tests/fixtures/scopefuel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run curated Darwin-sensitive suites
        shell: bash
        run: |
          awk 'BEGIN { section = "" } /^\[/ { section = $0; next } section == "[smoke]" && NF && $0 !~ /^#/ { print }' .github/macos-smoke.txt |
          while IFS= read -r command; do
            echo "::group::$command"
            bash -c "$command"
            echo '::endgroup::'
          done

  macos-full:
    name: macos-full
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_macos == true)
    runs-on: macos-latest
    env:
      SCOPEFUEL_BIN: ${{ github.workspace }}/tests/fixtures/scopefuel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run complete suite list
        shell: bash
        run: |
          while IFS='|' read -r shard command; do
            [[ -n "$shard" && "$shard" != \#* ]] || continue
            if [[ "$shard" == python && -z "${CI_PY_TMP:-}" ]]; then
              CI_PY_TMP="$(mktemp -d /tmp/ci-py.XXXXXX)"
              mkdir -p "$CI_PY_TMP"/{home,config,data,cache,state,runtime,codex,jobs}
              export HOME="$CI_PY_TMP/home" XDG_CONFIG_HOME="$CI_PY_TMP/config"
              export XDG_DATA_HOME="$CI_PY_TMP/data" XDG_CACHE_HOME="$CI_PY_TMP/cache"
              export XDG_STATE_HOME="$CI_PY_TMP/state" XDG_RUNTIME_DIR="$CI_PY_TMP/runtime"
              export XDG_CONFIG_DIRS="$CI_PY_TMP/config" XDG_DATA_DIRS="$CI_PY_TMP/data"
              export CODEX_HOME="$CI_PY_TMP/codex" ARBITER_INBOX_ROOT="$CI_PY_TMP/jobs"
              export TMPDIR="$CI_PY_TMP" WRK_TEST_MODE=1
              trap 'rm -rf "$CI_PY_TMP"' EXIT
            fi
            echo "::group::$shard: $command"
            bash -c "$command"
            echo '::endgroup::'
          done < tests/ci-suites.txt

  ci-ok:
    # On dispatches, a partial suite must not mint an exact 'ci-ok' check run.
    name: ${{ (inputs.suite || 'all') == 'all' && 'ci-ok' || format('ci-ok ({0})', inputs.suite) }}
    if: always()
    needs: [lint, changes, ubuntu, macos-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        env:
          LINT: ${{ needs.lint.result }}
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          UBUNTU: ${{ needs.ubuntu.result }}
          MACOS_SMOKE: ${{ needs.macos-smoke.result }}
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          if [[ "$LINT" != success || "$CHANGES" != success ]]; then
            echo "ci-ok failed: lint=$LINT changes=$CHANGES" >&2
            exit 1
          fi
          if [[ "$UBUNTU" == failure || "$UBUNTU" == cancelled || "$MACOS_SMOKE" == failure || "$MACOS_SMOKE" == cancelled ]]; then
            echo "ci-ok failed: ubuntu=$UBUNTU macos-smoke=$MACOS_SMOKE" >&2
            exit 1
          fi
          if [[ "$SUITE" == all ]]; then
            if [[ "$DOCS_ONLY" != true && ( "$UBUNTU" != success || "$MACOS_SMOKE" != success ) ]]; then
              echo "ci-ok failed: unexpected skip ubuntu=$UBUNTU macos-smoke=$MACOS_SMOKE docs_only=$DOCS_ONLY" >&2
              exit 1
            fi
          else
            case "$SUITE" in
              lint) ;;
              macos-smoke) EXPECTED="$MACOS_SMOKE" ;;
              suites-a|suites-b|python) EXPECTED="$UBUNTU" ;;
              *) echo "ci-ok failed: unknown suite $SUITE" >&2; exit 1 ;;
            esac
            if [[ "${EXPECTED:-success}" != success ]]; then
              echo "ci-ok failed: suite=$SUITE ubuntu=$UBUNTU macos-smoke=$MACOS_SMOKE" >&2
              exit 1
            fi
          fi
          echo "ci-ok passed: lint=$LINT changes=$CHANGES docs_only=$DOCS_ONLY ubuntu=$UBUNTU macos-smoke=$MACOS_SMOKE suite=$SUITE"
