name: CI

on:
  push:
    branches: [main]
  pull_request:

# Never re-run a superseded head's CI run; if it cancels the newest head's run, re-run the newest head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shell-and-bash-tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then exit 0; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
      - name: ShellCheck
        run: |
          shellcheck bin/wrk tests/test-wrk.sh tests/wrk_spillover.sh \
            tests/test-openai-independent-gate.sh \
            tests/test-builder-path.sh \
            tests/test-followup-injection.sh \
            tests/test-report-outside-worktree.sh \
            tests/test-model-contract-guard.sh \
            tests/test-installer-route.sh \
            tests/test-installer-deploy-record.sh \
            tests/test-prompt-suggestion-off.sh \
            tests/test-resume-settings.sh \
            tests/test-untagged-operator-evidence.sh \
            tests/test-event-monitor-doc.sh \
            tests/test-decision-request-doc.sh \
            tests/test-input-line-not-evidence.sh \
            tests/test-tester-family-policy.sh \
            tests/test-tester-eligible.sh \
            tests/test-ci-canonical-prose.sh \
            tests/test-assignment-defaults.sh \
            tests/test-t3-split-rule.sh \
            tests/test-merge-precheck.sh \
            tests/test-round-cap.sh \
            tests/test-wrk-rounds.sh \
            tests/test-wrk-heavy-limit.sh \
            tests/test-wrk-heavy-class.sh \
            tests/test-wrk-task-link.sh \
            tests/test-wrk-job-end.sh \
            tests/test-fleet-rev.sh \
            tests/test-gate-policy-devin-grades.sh \
            tests/test-codex-project-trust.sh \
            tests/test-area-propose.sh \
            tests/fixtures/fleet-rev/fake-ssh \
            tests/fixtures/fleet-rev/fake-gh \
            tests/fixtures/fleet-rev/panewire \
            tests/fixtures/fleet-rev/handoffkeep \
            tests/fixtures/fleet-rev/go \
            $(find tests/fixtures -maxdepth 1 -type f ! -name '*.json' ! -name 'handoffkeep' -perm -111 -print)
      - name: Bash tests
        env:
          SCOPEFUEL_BIN: ${{ github.workspace }}/tests/fixtures/scopefuel
        run: |
          bash tests/test-wrk.sh
          bash tests/test-codex-project-trust.sh
          bash tests/wrk_spillover.sh
          bash tests/test-arbiter.sh
          bash tests/test-acp-runner-process-group.sh
          bash tests/test-openai-independent-gate.sh
          bash tests/test-builder-path.sh
          bash tests/test-followup-injection.sh
          bash tests/test-report-outside-worktree.sh
          bash tests/test-model-contract-guard.sh
          bash tests/test-installer-route.sh
          bash tests/test-installer-deploy-record.sh
          bash tests/test-prompt-suggestion-off.sh
          bash tests/test-resume-settings.sh
          bash tests/test-untagged-operator-evidence.sh
          bash tests/test-event-monitor-doc.sh
          bash tests/test-decision-request-doc.sh
          bash tests/test-input-line-not-evidence.sh
          bash tests/test-tester-family-policy.sh
          bash tests/test-tester-eligible.sh
          bash tests/test-ci-canonical-prose.sh
          bash tests/test-assignment-defaults.sh
          bash tests/test-t3-split-rule.sh
          bash tests/test-merge-precheck.sh
          bash tests/test-round-cap.sh
          bash tests/test-wrk-rounds.sh
          bash tests/test-wrk-heavy-limit.sh
          bash tests/test-wrk-heavy-class.sh
          bash tests/test-wrk-task-link.sh
          bash tests/test-wrk-job-end.sh
          bash tests/test-fleet-rev.sh
          bash tests/test-gate-policy-devin-grades.sh
          bash tests/test-area-propose.sh
          python3 tests/test-node-ops.py
          python3 -m unittest tests/test_pa_review_scan.py -v
          python3 -m unittest discover -s tests -p 'test_wrk_fusion_sol_quota.py' -v
          python3 -m unittest discover -s tests -p 'test_quota_stale_report.py' -v
          python3 -m unittest discover -s tests -p 'test_wrk_trust_paths.py' -v
      - name: O3 canonical adapter, intents and projections (fake only)
        shell: bash
        run: |
          O3_TMP="$(mktemp -d /tmp/o3ci.XXXXXX)"
          trap 'python3 -c '\''import shutil,sys; shutil.rmtree(sys.argv[1])'\'' "$O3_TMP"' EXIT
          mkdir -p "$O3_TMP"/{home,config,data,cache,state,runtime,codex,jobs}
          HOME="$O3_TMP/home" XDG_CONFIG_HOME="$O3_TMP/config" \
            XDG_DATA_HOME="$O3_TMP/data" XDG_CACHE_HOME="$O3_TMP/cache" \
            XDG_STATE_HOME="$O3_TMP/state" XDG_RUNTIME_DIR="$O3_TMP/runtime" \
            CODEX_HOME="$O3_TMP/codex" ARBITER_INBOX_ROOT="$O3_TMP/jobs" \
            TMPDIR="$O3_TMP" WRK_TEST_MODE=1 \
            python3 -m unittest discover -s tests/o3 -p 'test_*.py' -v
      - name: Mock MCP isolation, project migration and assertion mutants (fake only)
        run: python -m unittest discover -s tests -p 'test_wrk_*mcp*.py' -v
